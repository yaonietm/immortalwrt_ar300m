name: Build GL-AR300M-NAND ImmortalWrt-25.12 Official
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout my configs
        uses: actions/checkout@v4
        path: my_cfg

      - name: Checkout official ImmortalWrt openwrt-25.12
        uses: actions/checkout@v4
        with:
          repository: immortalwrt/immortalwrt
          ref: openwrt-25.12
          path: src-immortalwrt

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf automake zlib1g-dev gcc-multilib

      - name: Apply config and files overlay
        run: |
          cp my_cfg/configs/.config src-immortalwrt/.config
          cp -r my_cfg/configs/files src-immortalwrt/files

      - name: Feeds update & install
        run: |
          cd src-immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Download source
        run: |
          cd src-immortalwrt
          make download -j$(nproc)

      - name: Compile
        run: |
          cd src-immortalwrt
          make -j$(nproc)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: GL-AR300M-NAND-ImmortalWrt-25.12
          path: src-immortalwrt/bin/targets/ath79/nand/*.bin
