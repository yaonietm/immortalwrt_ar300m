name: Build dual version
on:
  workflow_dispatch:
# 编译两个版本，速度加快；一个只有python版本，一个增加两个vpn
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 扩容磁盘
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048

      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf wget curl git python3 python3-pip unzip

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 复制自定义files目录
        run: |
          cp -r configs/files ./files

      # ===================== 第1套：delpasswall_addpython（基础python版） =====================
      - name: 导入配置 delpasswall_addpython
        run: |
          cp configs/delpasswall_addpython.config .config
      - name: 编译特定错误包
        run: |
          make package/libs/ustream-ssl/compile V=s
          
      - name: 编译固件 delpasswall_addpython
        run: |
          make -j$(nproc)

      - name: 上传固件 delpasswall_addpython
        uses: actions/upload-artifact@v4
        with:
          name: firmware-delpasswall_addpython
          path: bin/targets/

      # 删掉第一套的bin目录，避免产物混在一起，不碰build_dir，保留增量
      - name: 清理bin产物（保留编译中间文件）
        run: rm -rf bin

      # ===================== 第2套：add_wireguard_zerotier_frpc（增量增加VPN） =====================
      - name: 切换配置 add_wireguard_zerotier_frpc（增量）
        run: |
          cp configs/add_wireguard_zerotier_frpc.config .config
          make defconfig

      - name: 编译固件 add_wireguard_zerotier_frpc
        run: |
          make -j$(nproc)

      - name: 上传固件 add_wireguard_zerotier_frpc
        uses: actions/upload-artifact@v4
        with:
          name: firmware-add_wireguard_zerotier_frpc
          path: bin/targets/
