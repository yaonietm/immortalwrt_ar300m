name: Build ImmortalWrt 26.3 ar300m-nand with mqtt del passwall
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 扩容磁盘
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048

      - name: 拉取源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 缓存 host工具链 & dl源码包
        uses: actions/cache@v4
        with:
          path: |
            dl
            build_dir/host
            staging_dir/host
            staging_dir/hostpkg
          key: ${{ runner.os }}-immortalwrt-ar300m-host-${{ hashFiles('feeds.conf.default') }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-ar300m-host-

      - name: 刷新缓存内stamp时间戳
        run: |
          find staging_dir/host build_dir/host \( -name ".built" -o -name "*.stamp" \) 2>/dev/null -exec touch {} + || true


      - name: 安装编译依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential libncurses-dev gawk flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev libiberty-dev autoconf wget curl git python3 python3-pip unzip

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: 复制自定义files目录
        run: |
          cp -r configs/files ./files

      - name: 导入你的配置
        run: |
          cp configs/closepasswall.config .config
          make defconfig

      - name: 编译固件
        run: |
          make -j$(nproc)

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: bin/targets/
